name: build-macos-app

# Reusable (workflow_call) pipeline that signs, builds, notarizes, staples,
# packages, and uploads the macOS app distribution set:
#
#   Open-Computer-Use-macOS.zip + SHA256SUMS.txt + app-manifest.json
#
# as the artifact "macos-app". Called by release.yml (stable) and
# release-app.yml (prerelease), both with require_identity=true so approved
# publication never falls back to ad-hoc signing. require_identity=false is
# reserved for explicitly non-published development builds.

on:
  workflow_call:
    inputs:
      channel:
        description: "Release channel recorded in app-manifest.json"
        required: true
        type: string
        default: "stable"
      require_identity:
        description: "Fail instead of falling back to ad-hoc signing when the APPLE_* secrets are missing"
        required: true
        type: boolean
        default: false
      ref:
        description: "Branch, tag, or SHA to check out (empty = the calling workflow's ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    outputs:
      stapled: ${{ steps.notarize.outputs.stapled }}
      sha: ${{ steps.resolved.outputs.sha }}
      sha7: ${{ steps.resolved.outputs.sha7 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          # Full history keeps the CFBundleVersion commit counter monotonic.
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Record resolved commit
        id: resolved
        run: |
          # Resolve the (possibly symbolic) input ref exactly once, here, and
          # expose the immutable SHA so callers tag and target the same commit
          # that was actually built.
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "sha7=${sha:0:7}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.25.x"

      - name: Prepare Open Computer Use signing config
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          REQUIRE_IDENTITY: ${{ inputs.require_identity }}
        run: |
          echo "OPEN_COMPUTER_USE_CODESIGN_MODE=adhoc" >> "${GITHUB_ENV}"

          if [ -z "${APPLE_CERTIFICATE}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD}" ]; then
            if [ "${REQUIRE_IDENTITY}" = "true" ]; then
              echo "APPLE_CERTIFICATE secrets are required for this build (require_identity=true); refusing to fall back to ad-hoc signing." >&2
              exit 1
            fi
            echo "No signing certificate configured (APPLE_CERTIFICATE secrets missing); app will be ad-hoc signed."
            exit 0
          fi

          keychain_password="open-computer-use-ci-${RUNNER_TEMP}"
          cert_path="${RUNNER_TEMP}/open-computer-use-signing.p12"
          keychain_path="${RUNNER_TEMP}/open-computer-use-signing.keychain-db"

          printf '%s' "${APPLE_CERTIFICATE}" | base64 -d > "${cert_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" -k "${keychain_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"

          resolved_identity="${APPLE_SIGNING_IDENTITY:-}"
          if [ -z "${resolved_identity}" ]; then
            # Only auto-select a Developer ID Application identity; never the
            # first arbitrary codesigning identity.
            resolved_identity="$(security find-identity -v -p codesigning "${keychain_path}" | sed -n 's/^.*"\(Developer ID Application:[^"]*\)"/\1/p' | head -n 1)"
          fi
          if [ -z "${resolved_identity}" ]; then
            echo "Imported signing certificate, but no usable codesigning identity was found in ${keychain_path}." >&2
            exit 1
          fi

          echo "Resolved Open Computer Use signing identity: ${resolved_identity}"

          {
            echo "OPEN_COMPUTER_USE_CODESIGN_MODE=identity"
            echo "OPEN_COMPUTER_USE_CODESIGN_IDENTITY=${resolved_identity}"
            echo "OPEN_COMPUTER_USE_CODESIGN_KEYCHAIN=${keychain_path}"
          } >> "${GITHUB_ENV}"

      - name: Build macOS app
        run: ./scripts/build-open-computer-use-app.sh --configuration release --arch universal

      - name: Verify Developer ID signature against approved team
        if: ${{ inputs.require_identity }}
        run: |
          # Approved Route A trust anchor: an Apple-anchored Developer ID
          # signature on the expected bundle identifier from the approved
          # team. A populated secret alone is not this check.
          requirement='anchor apple generic and identifier "com.ifuryst.opencomputeruse" and certificate leaf[subject.OU] = "DSA846ZFPA"'
          codesign --verify --deep --strict -R="${requirement}" "dist/Open Computer Use.app"

      - name: Notarize macOS app
        id: notarize
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          REQUIRE_IDENTITY: ${{ inputs.require_identity }}
        run: |
          echo "stapled=false" >> "${GITHUB_OUTPUT}"

          if [ -z "${APPLE_NOTARY_API_KEY_P8_BASE64}" ] || [ -z "${APPLE_NOTARY_KEY_ID}" ] || [ -z "${APPLE_NOTARY_ISSUER_ID}" ] || [ -z "${APPLE_DEVELOPER_TEAM_ID}" ]; then
            if [ "${REQUIRE_IDENTITY}" = "true" ]; then
              echo "APPLE_NOTARY_* secrets are required for this build (require_identity=true)." >&2
              exit 1
            fi
            echo "APPLE_NOTARY_* secrets not configured; skipping notarization. Browser-downloaded builds will need manual quarantine removal on launch."
            exit 0
          fi

          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          zip_path="${RUNNER_TEMP}/open-computer-use-app.zip"
          printf '%s' "${APPLE_NOTARY_API_KEY_P8_BASE64}" | base64 -d > "${key_path}"

          ditto -c -k --keepParent "dist/Open Computer Use.app" "${zip_path}"

          xcrun notarytool submit "${zip_path}" \
            --key "${key_path}" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}" \
            --team-id "${APPLE_DEVELOPER_TEAM_ID}" \
            --wait

          xcrun stapler staple "dist/Open Computer Use.app"
          xcrun stapler validate "dist/Open Computer Use.app"
          echo "stapled=true" >> "${GITHUB_OUTPUT}"

      - name: Package macOS app distribution
        run: |
          ./scripts/package-macos-app.sh \
            --app "dist/Open Computer Use.app" \
            --out-dir dist/app \
            --channel "${{ inputs.channel }}" \
            --notarized "${{ steps.notarize.outputs.stapled }}"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-app
          path: |
            dist/app/Open-Computer-Use-macOS.zip
            dist/app/SHA256SUMS.txt
            dist/app/app-manifest.json
          if-no-files-found: error
