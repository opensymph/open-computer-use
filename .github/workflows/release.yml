name: release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: "Publish the staged npm packages to npmjs.org"
        required: true
        default: false
        type: boolean
      npm_tag:
        description: "npm dist-tag to use when publish_to_npm is enabled"
        required: true
        default: latest
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release-metadata:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Validate reviewed GitHub Release notes
        if: ${{ github.event_name == 'push' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node ./scripts/validate-github-release-notes.mjs --tag "${RELEASE_TAG}"

  # Stable macOS app publication is fail-closed (approved Route A): the
  # reusable workflow refuses ad-hoc signing or a missing notarization
  # staple when require_identity=true, and verifies the Developer ID
  # signature against the approved team before packaging. Ad-hoc builds
  # exist only as local development builds (scripts/build-open-computer-use-app.sh
  # with OPEN_COMPUTER_USE_CODESIGN_MODE=adhoc), never on this path.
  build-macos-app:
    needs: release-metadata
    uses: ./.github/workflows/build-macos-app.yml
    with:
      channel: stable
      require_identity: true
    secrets: inherit

  package-npm:
    needs: [release-metadata, build-macos-app]
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          # Full history keeps the CFBundleVersion commit counter monotonic.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.25.x"

      - name: Check npm trusted publishing CLI
        run: |
          node --version
          go version
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) { console.error(`npm ${process.argv[1]} is too old for trusted publishing; need 11.5.1+`); process.exit(1); }' "${npm_version}"

      - name: Download macOS app artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: macos-app
          path: dist/app

      - name: Unpack macOS app for npm packaging
        run: |
          ditto -x -k "dist/app/Open-Computer-Use-macOS.zip" dist/
          [[ -d "dist/Open Computer Use.app" ]]

      - name: Build npm release artifacts
        env:
          OPEN_COMPUTER_USE_SKIP_APP_BUILD: "1"
        run: npm run npm:pack

      - name: Upload npm release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-release-artifacts
          path: |
            dist/release/npm/*.tgz
            dist/release/release-manifest.json
          if-no-files-found: error

      - name: Configure npm token fallback
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            printf '%s\n%s\n' \
              "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" \
              "registry=https://registry.npmjs.org/" \
              > "${RUNNER_TEMP}/npm-token-fallback.npmrc"
            echo "NPM_CONFIG_USERCONFIG=${RUNNER_TEMP}/npm-token-fallback.npmrc" >> "${GITHUB_ENV}"
            echo "NODE_AUTH_TOKEN=${NPM_TOKEN}" >> "${GITHUB_ENV}"
          fi

      - name: Check npm publish credentials
        id: npm_auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "NPM_TOKEN not configured; skipping npm publish. Tarballs stay attached to the workflow run and the GitHub Release. To publish with OIDC trusted publishing only, rerun via workflow_dispatch with publish_to_npm=true."
          fi

      - name: Publish packages to npm
        if: ${{ (github.event_name == 'push' && steps.npm_auth.outputs.available == 'true') || inputs.publish_to_npm }}
        env:
          NPM_DIST_TAG: ${{ github.event_name == 'push' && 'latest' || inputs.npm_tag }}
        run: |
          node ./scripts/npm/publish-packages.mjs \
            --skip-build \
            --out-dir dist/release/npm-staging \
            --tag "${NPM_DIST_TAG}"

  github-release:
    needs: [release-metadata, package-npm]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Download npm release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: npm-release-artifacts
          path: dist/release/out

      - name: Download macOS app artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: macos-app
          path: dist/app

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes_path="docs/releases/github/${RELEASE_TAG}.md"
          app_assets=(dist/app/Open-Computer-Use-macOS.zip dist/app/SHA256SUMS.txt dist/app/app-manifest.json)

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/release/out/npm/*.tgz dist/release/out/release-manifest.json "${app_assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${notes_path}"
          else
            gh release create "${RELEASE_TAG}" dist/release/out/npm/*.tgz dist/release/out/release-manifest.json "${app_assets[@]}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${notes_path}"
          fi
